name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 下载内置字体（不随仓库分发，见 assets/fonts/README.md）
        run: |
          curl -sL --retry 3 -o assets/fonts/LXGWWenKai-Regular.ttf "https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/LXGWWenKai-Regular.ttf"
          curl -sL --retry 3 -o assets/fonts/ZCOOLKuaiLe-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/zcoolkuaile/ZCOOLKuaiLe-Regular.ttf"
          test $(stat -c%s assets/fonts/LXGWWenKai-Regular.ttf) -gt 10000000
          test $(stat -c%s assets/fonts/ZCOOLKuaiLe-Regular.ttf) -gt 1000000
          ls -la assets/fonts
      - name: 解码并校验正式签名钥匙
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/xiaoma-release.jks"
          echo "f946a471a600c98ad4b16ec13e2d05fc20f812fc41ae64e2951167cee2b25c6b  $RUNNER_TEMP/xiaoma-release.jks" | sha256sum -c -
          keytool -list -keystore "$RUNNER_TEMP/xiaoma-release.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /dev/null
          echo "签名钥匙完整性与密码校验通过"
      # 按架构分包：只取 arm64 瘦身包交付（小米等主流机型均为 arm64），
      # 包体从 112MB 降到 90MB 内，临时下载链接（约 100MB 上限）才能发
      - run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/xiaoma-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoma-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
